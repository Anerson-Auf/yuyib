[workspace]
members = [
    "xtask",
    "crates/yuyib-core",
    "crates/yuyib-ecs",
    "crates/yuyib-authoring",
    "crates/yuyib-authoring-yuyib",
    "crates/yuyib-scene-projection",
    "crates/yuyib-scene-interaction",
    "crates/yuyib-editor-core",
    "crates/yuyib-editor",
    "crates/yuyib-play",
    "crates/yuyib-platform",
    "crates/yuyib-render",
    "crates/yuyib-app",
    "crates/yuyib-game",
    "crates/yuyib-assets",
    "crates/yuyib-2d",
    "crates/yuyib-animation",
    "crates/yuyib-tiled",
    "crates/yuyib-image",
    "crates/yuyib-gltf",
    "crates/yuyib-model",
    "crates/yuyib-model-assets",
    "crates/yuyib-render-2d",
    "crates/yuyib-render-3d",
    "crates/yuyib-render-texture",
    "crates/yuyib-scene",
    "crates/yuyib-shader",
    "crates/yuyib-game-2d",
    "crates/yuyib-game-3d",
    "crates/yuyib-game-3d-authoring",
    "crates/yuyib-gltf-authoring",
    "crates/yuyib-character-3d",
    "crates/yuyib-character-2d",
    "crates/yuyib-profile-2d",
    "crates/yuyib-profile-3d",
    "crates/yuyib-gameplay",
    "crates/yuyib-input",
    "crates/yuyib-vmf",
    "crates/yuyib-vmf-model",
    "crates/yuyib-source1",
    "crates/yuyib-bsp",
    "crates/yuyib-source1-bsp",
    "crates/yuyib-vmt",
    "crates/yuyib-vtf",
    "crates/yuyib-ui",
    "crates/yuyib-ui-render",
    "crates/yuyib-ui-text",
    "crates/yuyib-ui-text-render",
    "crates/yuyib-webview",
    "crates/yuyib-source1-assets",
    "crates/yuyib-source1-scene",
    "crates/yuyib-physics",
    "crates/yuyib-audio",
    "crates/yuyib-net",
    "crates/yuyib-tasks",
    "crates/yuyib",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Anerson"]
repository = "https://github.com/Anerson-Auf/yuyib"

[workspace.dependencies]
bevy_ecs = "0.19.0"
pollster = "0.4.0"
rapier3d = "0.34.0"
rapier2d = "0.34.0"
wgpu = "30.0.0"
winit = "0.30.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
