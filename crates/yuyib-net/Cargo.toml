[package]
name = "yuyib-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded versioned TCP wire frames and optional typed JSON transport for Yuyib."

[dependencies]
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.149"
tokio = { version = "1.53.1", default-features = false, features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
bevy_ecs = { workspace = true, optional = true }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }

[features]
default = []
ecs = ["dep:bevy_ecs"]

[lints]
workspace = true
