[package]
name = "yuyib-tiled"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded Tiled JSON/TMX map importer for Yuyib TileMap2d."

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.1"
roxmltree = "0.21.1"
ruzstd = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
yuyib-2d = { path = "../yuyib-2d" }
yuyib-assets = { path = "../yuyib-assets" }
yuyib-game-2d = { path = "../yuyib-game-2d" }

[dev-dependencies]
zstd = "0.13.3"

[lints]
workspace = true
