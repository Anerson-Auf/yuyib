[package]
name = "yuyib-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic lightweight 2D and 3D physics foundations for Yuyib."

[features]
default = []
# Mature 3D dynamics backend (M4 facade). Static mesh queries stay available without it.
rapier = ["dep:rapier3d"]
# Mature 2D dynamics backend (M4.13 facade). Lightweight Body2d prototypes stay available without it.
rapier2d = ["dep:rapier2d"]

[dependencies]
bevy_ecs.workspace = true
yuyib-ecs = { path = "../yuyib-ecs" }
rapier3d = { workspace = true, optional = true }
rapier2d = { workspace = true, optional = true }

[lints]
workspace = true
