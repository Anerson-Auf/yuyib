[package]
name = "yuyib-gltf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Validated, static glTF 2.0 model importer for Yuyib."

[dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
gltf = { version = "1.4.1", default-features = false, features = ["KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_pbrSpecularGlossiness", "names", "utils"] }
serde = { version = "1.0.228", features = ["derive"] }
yuyib-assets = { path = "../yuyib-assets" }
yuyib-model = { path = "../yuyib-model" }

[lints]
workspace = true
