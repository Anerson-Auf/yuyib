[package]
name = "yuyib"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native-first Rust runtime for Windows applications, games and optional WebViews."

[features]
default = ["desktop-full"]

# Curated capability sets. `desktop-full` preserves the current out-of-the-box
# experience, while applications can opt into a substantially smaller graph.
desktop-full = ["game", "two-d", "three-d", "audio", "net", "source1", "ui", "gameplay"]
headless = ["core", "ecs", "tasks", "assets", "physics", "gameplay", "net"]

core = ["dep:yuyib-core"]
ecs = ["dep:yuyib-ecs"]
tasks = ["dep:yuyib-tasks"]
assets = ["dep:yuyib-assets", "tasks"]
physics = ["dep:yuyib-physics", "ecs"]
## Optional Rapier dynamics backend for M4 (`DynamicsBackend3d`).
physics-rapier = ["physics", "yuyib-physics/rapier", "yuyib-profile-3d?/rapier"]
## Optional Rapier 2D dynamics backend for M4.13 (`DynamicsBackend2d`).
physics-rapier2d = ["physics", "yuyib-physics/rapier2d"]
## Rapier-backed 2D platformer controller (separate from top-down sprite kinematic).
character-2d = ["physics-rapier2d", "dep:yuyib-character-2d", "yuyib-profile-2d?/character-2d"]
## Optional gilrs HID stick adapter (`yuyib::input::GilrsGamepadAdapter2d`).
gamepad = ["three-d", "yuyib-input/gamepad"]
## M5 3D composition profile (`Game3dProfile` / `CharacterGame3d`).
## Enabled with `three-d`; this alias keeps smoke examples explicit.
profile-3d = ["three-d"]
## M5 2D composition profile (`Game2dProfile`).
## Enabled with `two-d`; this alias keeps smoke examples explicit.
profile-2d = ["two-d"]
gameplay = ["dep:yuyib-gameplay", "ecs", "physics"]
net = ["dep:yuyib-net", "yuyib-net/ecs"]
audio = ["dep:yuyib-audio"]

platform = ["dep:yuyib-platform"]
render = ["dep:yuyib-render", "platform"]
app = ["dep:yuyib-app", "core", "platform", "render"]
game = ["dep:yuyib-game", "app", "ecs"]

ui = [
    "app",
    "dep:yuyib-ui",
    "dep:yuyib-ui-render",
    "dep:yuyib-ui-text",
    "dep:yuyib-ui-text-render",
    "yuyib-app/ui-text",
    "yuyib-game?/ui-text",
]
two-d = [
    "assets",
    "ecs",
    "physics",
    "render",
    "dep:yuyib-2d",
    "dep:yuyib-animation",
    "dep:yuyib-tiled",
    "dep:yuyib-game-2d",
    "dep:yuyib-image",
    "dep:yuyib-render-2d",
    "dep:yuyib-render-texture",
    "dep:yuyib-profile-2d",
]
three-d = [
    "assets",
    "ecs",
    "physics",
    "render",
    "dep:yuyib-character-3d",
    "dep:yuyib-game-3d",
    "dep:yuyib-gltf",
    "dep:yuyib-image",
    "dep:yuyib-input",
    "dep:yuyib-model",
    "dep:yuyib-model-assets",
    "dep:yuyib-render-3d",
    "dep:yuyib-scene",
    "dep:yuyib-shader",
    "dep:yuyib-profile-3d",
]
source1 = [
    "three-d",
    "dep:yuyib-bsp",
    "dep:yuyib-source1",
    "dep:yuyib-source1-assets",
    "dep:yuyib-source1-bsp",
    "dep:yuyib-source1-scene",
    "dep:yuyib-source1-render-3d",
    "dep:yuyib-vmf",
    "dep:yuyib-vmf-model",
    "dep:yuyib-vmt",
    "dep:yuyib-vtf",
]
webview = ["app", "dep:yuyib-webview", "yuyib-app/webview"]

[dependencies]
yuyib-core = { path = "../yuyib-core", version = "0.1.0", optional = true }
yuyib-ecs = { path = "../yuyib-ecs", version = "0.1.0", optional = true }
yuyib-app = { path = "../yuyib-app", version = "0.1.0", optional = true }
yuyib-2d = { path = "../yuyib-2d", version = "0.1.0", optional = true }
yuyib-animation = { path = "../yuyib-animation", version = "0.1.0", optional = true }
yuyib-tiled = { path = "../yuyib-tiled", version = "0.1.0", optional = true }
yuyib-assets = { path = "../yuyib-assets", version = "0.1.0", optional = true }
yuyib-audio = { path = "../yuyib-audio", version = "0.1.0", optional = true }
yuyib-gameplay = { path = "../yuyib-gameplay", version = "0.1.0", optional = true }
yuyib-physics = { path = "../yuyib-physics", version = "0.1.0", optional = true }
yuyib-game-2d = { path = "../yuyib-game-2d", version = "0.1.0", optional = true }
yuyib-game-3d = { path = "../yuyib-game-3d", version = "0.1.0", optional = true }
yuyib-game = { path = "../yuyib-game", version = "0.1.0", optional = true }
yuyib-character-3d = { path = "../yuyib-character-3d", version = "0.1.0", optional = true }
yuyib-character-2d = { path = "../yuyib-character-2d", version = "0.1.0", optional = true }
yuyib-profile-3d = { path = "../yuyib-profile-3d", version = "0.1.0", optional = true }
yuyib-profile-2d = { path = "../yuyib-profile-2d", version = "0.1.0", optional = true }
yuyib-image = { path = "../yuyib-image", version = "0.1.0", optional = true }
yuyib-input = { path = "../yuyib-input", version = "0.1.0", optional = true }
yuyib-gltf = { path = "../yuyib-gltf", version = "0.1.0", optional = true }
yuyib-model = { path = "../yuyib-model", version = "0.1.0", optional = true }
yuyib-model-assets = { path = "../yuyib-model-assets", version = "0.1.0", optional = true }
yuyib-net = { path = "../yuyib-net", version = "0.1.0", optional = true }
yuyib-platform = { path = "../yuyib-platform", version = "0.1.0", optional = true }
yuyib-render = { path = "../yuyib-render", version = "0.1.0", optional = true }
yuyib-render-2d = { path = "../yuyib-render-2d", version = "0.1.0", optional = true }
yuyib-render-3d = { path = "../yuyib-render-3d", version = "0.1.0", optional = true }
yuyib-render-texture = { path = "../yuyib-render-texture", version = "0.1.0", optional = true }
yuyib-scene = { path = "../yuyib-scene", version = "0.1.0", optional = true }
yuyib-shader = { path = "../yuyib-shader", version = "0.1.0", optional = true }
yuyib-source1 = { path = "../yuyib-source1", version = "0.1.0", optional = true }
yuyib-bsp = { path = "../yuyib-bsp", version = "0.1.0", optional = true }
yuyib-source1-scene = { path = "../yuyib-source1-scene", version = "0.1.0", optional = true }
yuyib-source1-render-3d = { path = "../yuyib-source1-render-3d", version = "0.1.0", optional = true }
yuyib-source1-bsp = { path = "../yuyib-source1-bsp", version = "0.1.0", optional = true }
yuyib-tasks = { path = "../yuyib-tasks", version = "0.1.0", optional = true }
yuyib-vmf = { path = "../yuyib-vmf", version = "0.1.0", optional = true }
yuyib-vmf-model = { path = "../yuyib-vmf-model", version = "0.1.0", optional = true }
yuyib-vmt = { path = "../yuyib-vmt", version = "0.1.0", optional = true }
yuyib-vtf = { path = "../yuyib-vtf", version = "0.1.0", optional = true }
yuyib-ui = { path = "../yuyib-ui", version = "0.1.0", optional = true }
yuyib-ui-render = { path = "../yuyib-ui-render", version = "0.1.0", optional = true }
yuyib-ui-text = { path = "../yuyib-ui-text", version = "0.1.0", optional = true }
yuyib-ui-text-render = { path = "../yuyib-ui-text-render", version = "0.1.0", optional = true }
yuyib-webview = { path = "../yuyib-webview", version = "0.1.0", optional = true }
yuyib-source1-assets = { path = "../yuyib-source1-assets", version = "0.1.0", optional = true }

[dev-dependencies]
bevy_ecs.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

