# Windows-first Rust CI. Prefer foundation crates over full --workspace.
# Full GPU / interactive Editor / xtask docs are out of scope here.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"

jobs:
  foundation:
    name: Foundation check + test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: foundation-windows

      - name: Check curated facade
        run: cargo check -p yuyib

      - name: Authoring / editor-core / render libs
        run: >
          cargo test
          -p yuyib-authoring
          -p yuyib-authoring-yuyib
          -p yuyib-editor-core
          -p yuyib-render
          --lib
          -- --test-threads=2

      - name: Editor coverage gate (yuyib-gltf-authoring)
        run: >
          cargo test -p yuyib-gltf-authoring
          -- --test-threads=2

      - name: Upload coverage manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-coverage-manifest
          path: crates/yuyib-gltf-authoring/tests/fixtures/coverage-manifest.json
          if-no-files-found: error
          retention-days: 14

  clippy:
    name: Clippy (scoped)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-windows

      - name: Clippy foundation crates
        # Lint only the listed packages. Without `--no-deps`, Clippy also
        # denies lints in path dependencies (yuyib-model, yuyib-image, …).
        # Pedantic stays advisory (workspace warn); CI denies clippy::all.
        run: >
          cargo clippy
          -p yuyib-authoring
          -p yuyib-authoring-yuyib
          -p yuyib-editor-core
          -p yuyib-gltf-authoring
          -p yuyib-render
          --no-deps
          -- -D clippy::all -A clippy::pedantic
